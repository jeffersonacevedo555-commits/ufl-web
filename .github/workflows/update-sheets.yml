name: Refresh UFL sheet tabs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run update-config
        env:
          CURRENT_SHEET_ID: ${{ secrets.CURRENT_SHEET_ID }}
          HISTORICAL_SHEET_ID: ${{ secrets.HISTORICAL_SHEET_ID }}
        run: node scripts/update-config.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update sheet tabs"
          git push